name: Refresh Skills Upkeep on skills.sh
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  refresh:
    if: ${{ !github.event.release.prerelease && github.repository == 'notuxius/skills' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify the release is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          default_ref="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor HEAD "$default_ref"; then
            echo "::error::The released commit must be on $DEFAULT_BRANCH before skills.sh can index it."
            exit 1
          fi
          catalog_commit=$(git rev-parse "$default_ref")
          echo "CATALOG_COMMIT=$catalog_commit" >> "$GITHUB_ENV"
          git -c core.autocrlf=false archive --format=zip --output="$RUNNER_TEMP/skills-upkeep-expected.zip" "$catalog_commit:skills/skills-upkeep"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Request indexing and verify the installed files
        run: |
          cd "$(mktemp -d)"
          # This install requests indexing and can contribute to the public install count.
          npx --yes skills@1.9.0 add "$GITHUB_REPOSITORY@$CATALOG_COMMIT" --skill skills-upkeep --agent codex --copy --yes
          unzip -q "$RUNNER_TEMP/skills-upkeep-expected.zip" -d "$RUNNER_TEMP/skills-upkeep-expected"
          diff -qr "$RUNNER_TEMP/skills-upkeep-expected" .agents/skills/skills-upkeep
      - name: Verify the skills.sh snapshot
        run: |
          snapshot_url="https://www.skills.sh/api/download/$GITHUB_REPOSITORY/skills-upkeep"
          expected="$RUNNER_TEMP/skills-upkeep-expected.zip"
          actual="$RUNNER_TEMP/skills-upkeep-indexed.json"
          for attempt in {1..6}; do
            history=()
            if [[ "$attempt" == 6 ]]; then
              history=("$CATALOG_COMMIT")
            fi
            if curl --fail --silent --show-error --max-time 20 --output "$actual" "$snapshot_url" \
              && python3 .github/scripts/check_skills_snapshot.py "$expected" "$actual" "${history[@]}"; then
              exit 0
            fi
            if [[ "$attempt" != 6 ]]; then
              sleep 60
            fi
          done
          echo "::error::Could not verify the complete skill on skills.sh after the install."
          exit 1
