name: Role skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercises:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - run: npm run skills:verify -- ..
      - run: python3 tools/replay_update.py
      - name: Test a fresh install and an npm-bundled skill upgrade
        run: npm run skills:bundle-test
      - name: Exercise installation and selective updates from the public catalog
        run: npm run skills:public-test
