name: Role skill checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercises:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm test
      - run: npm run skills:verify -- ..
      - run: python3 tools/replay_update.py
      - name: Test a fresh install and an npm-bundled skill upgrade
        run: npm run skills:bundle-test
      - name: Exercise installation and selective updates from the public catalog
        if: github.event_name == 'workflow_dispatch'
        run: npm run skills:public-test
