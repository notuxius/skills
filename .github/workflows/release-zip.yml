name: Skills Upkeep release ZIP
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
  release:
    types: [published]

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Check the skill and telemetry versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
        run: node .github/scripts/check_release_tag.mjs "$RELEASE_TAG"

  tag:
    name: Create validated release tag
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Tag the validated default-branch commit
        env:
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" != "$DEFAULT_REF" ]]; then
            echo "::error::Run this workflow from the default branch."
            exit 1
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$RELEASE_TAG" -f sha="$GITHUB_SHA" --silent

  package:
    if: ${{ github.event_name == 'release' }}
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Package the released skill
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          git -c core.autocrlf=false archive --format=zip --prefix=skills-upkeep/ \
            --output="skills-upkeep-$RELEASE_TAG.zip" HEAD:skills/skills-upkeep \
            SKILL.md
      - name: Attach the ZIP to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        shell: bash
        run: |
          asset="skills-upkeep-$RELEASE_TAG.zip"
          assets=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if ! grep -Fxq -- "$asset" <<< "$assets"; then
            gh release upload "$RELEASE_TAG" "$asset"
          fi

  refresh:
    needs: package
    uses: ./.github/workflows/skills-sh-refresh.yml
